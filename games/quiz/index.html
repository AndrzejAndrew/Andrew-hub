<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #05060a; color: #f8fafc; font-family: 'Inter', sans-serif;
      margin: 0; padding: 30px 20px; display: flex; justify-content: center;
    }
    .quiz-wrapper { max-width: 800px; width: 100%; }
    h1 { color: #fff; font-size: 2.2rem; margin-bottom: 5px; text-align: center; }
    .meta-text { color: #8b95a5; font-size: 0.9rem; text-align: center; margin-bottom: 25px; }

    .panel {
      background: rgba(10,12,18,0.8); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .view-section { display: none; animation: fadeIn 0.3s ease; }
    .active-view { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 20px;
      border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: 0.2s;
    }
    .btn:hover { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(180deg, rgba(52,211,153,0.2), rgba(52,211,153,0.05)); border-color: rgba(52,211,153,0.4); color: #34d399; width: 100%; padding: 14px; font-size: 1.1rem;}
    
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; color: #8b95a5; margin-bottom: 5px; }
    .input-control {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4); color: #fff; font-size: 1rem; outline: none; box-sizing: border-box;
    }
    .input-control:focus { border-color: #7dd3fc; }
    
    .flex-row { display: flex; gap: 15px; }
    .flex-row > div { flex: 1; }
    .flex-column { display: flex; flex-direction: column; gap: 15px; margin-top: 20px;}

    .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
    .player-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; text-align: center; color: #7dd3fc; font-weight: 600; }
    .player-card.answered { background: rgba(52,211,153,0.1); border-color: #34d399; color: #34d399; }
    .code-display { font-size: 2rem; color: #34d399; letter-spacing: 4px; text-align: center; margin: 10px 0; font-weight: bold; }
    .hidden { display: none !important; }

    /* ODLICZANIE & PASKI CZASU */
    .countdown-container { display: flex; justify-content: center; align-items: center; height: 40vh; }
    #countdown-text { font-size: 8rem; color: #34d399; margin: 0; text-shadow: 0 0 40px rgba(52,211,153,0.5); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

    .progress-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; margin-top: 10px;}
    .progress-bar { height: 100%; background: linear-gradient(90deg, #7dd3fc, #d8b4fe); width: 100%; }
    
    .cat-btn { padding: 20px; font-size: 1.2rem; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.2s;}
    .cat-btn:hover { background: rgba(125,211,252,0.1); border-color: #7dd3fc; }
    
    /* GŁÓWNA GRA - PYTANIA */
    .question-box { text-align: center; font-size: 1.5rem; margin: 20px 0 30px; font-weight: 600; line-height: 1.4; }
    .ans-btn { 
      padding: 15px; font-size: 1.1rem; border-radius: 12px; background: rgba(255,255,255,0.05); 
      border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.2s;
    }
    .ans-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); transform: scale(1.02); }
    .ans-btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .ans-selected { border-color: #7dd3fc !important; background: rgba(125,211,252,0.1) !important; color: #7dd3fc; }
    .ans-correct { border-color: #34d399 !important; background: rgba(52,211,153,0.2) !important; color: #34d399 !important; }
    .ans-wrong { border-color: #f43f5e !important; background: rgba(244,63,94,0.2) !important; color: #f43f5e !important; }
    
    .leaderboard-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .leaderboard-row:last-child { border-bottom: none; }
    .rank-1 { color: #fbbf24; font-weight: bold; font-size: 1.1rem;}
  </style>
</head>
<body>

<div class="quiz-wrapper">
  <h1>Wielki Quiz</h1>
  <p class="meta-text" id="status-text">Łączenie z bazą...</p>

  <!-- WIDOK 1: MENU GŁÓWNE -->
  <div id="view-menu" class="view-section active-view">
    <div class="flex-row">
      <div class="panel">
        <h2 style="margin-top:0; color:#34d399;">Utwórz Pokój (Host)</h2>
        <div class="flex-row">
          <div class="input-group"><label>Liczba pytań</label><input type="number" id="set-questions" class="input-control" value="5"></div>
          <div class="input-group"><label>Czas głosowania (sek)</label><input type="number" id="set-votetime" class="input-control" value="10"></div>
        </div>
        <div class="input-group"><label>Czas na odp. (sek)</label><input type="number" id="set-anstime" class="input-control" value="15"></div>
        <button class="btn btn-primary" onclick="createRoom()">Utwórz grę</button>
      </div>

      <div class="panel">
        <h2 style="margin-top:0; color:#7dd3fc;">Dołącz do Gry</h2>
        <div class="input-group"><label>Twój Nick</label><input type="text" id="join-nick" class="input-control"></div>
        <div class="input-group"><label>Kod Pokoju</label><input type="text" id="join-code" class="input-control" style="text-transform: uppercase;"></div>
        <button class="btn btn-primary" onclick="joinRoom()" style="background: rgba(56,189,248,0.1); color:#7dd3fc; border-color:#7dd3fc;">Dołącz</button>
      </div>
    </div>
    <div style="text-align: center;"><button class="btn" onclick="toggleProposeModal()">💡 Zaproponuj własne pytanie do bazy</button></div>
  </div>

  <!-- WIDOK 2: LOBBY POKOJU -->
  <div id="view-lobby" class="view-section panel">
    <h2 style="text-align:center; margin-top:0;">Oczekujący gracze</h2>
    <div class="code-display" id="lobby-code">----</div>
    <div class="players-grid" id="players-list"></div>
    <div id="host-controls" class="hidden" style="margin-top: 30px;">
      <button class="btn btn-primary" onclick="initiateStart()">▶ Rozpocznij Quiz</button>
    </div>
  </div>

  <!-- WIDOK 3: ODLICZANIE -->
  <div id="view-countdown" class="view-section">
    <div class="countdown-container"><h2 id="countdown-text">5</h2></div>
  </div>

  <!-- WIDOK 4: GŁOSOWANIE NA KATEGORIĘ -->
  <div id="view-voting" class="view-section panel">
    <h2 style="text-align:center; margin-top:0; color:#d8b4fe;">Wybierz kategorię (Pytanie <span id="q-counter">1</span>)</h2>
    <div class="progress-container"><div id="vote-progress" class="progress-bar"></div></div>
    <div id="category-buttons" class="flex-column"></div>
    <p id="vote-status" class="meta-text" style="margin-top: 20px; font-size:1.1rem; color:#7dd3fc;">Oddane głosy: 0 / 0</p>
  </div>

  <!-- WIDOK 5: PYTANIE -->
  <div id="view-question" class="view-section panel">
    <h3 style="color:#d8b4fe; text-align:center; margin-top:0;" id="q-category-label">Kategoria</h3>
    <div class="progress-container"><div id="ans-progress" class="progress-bar"></div></div>
    
    <div class="question-box" id="q-text">Ładowanie pytania...</div>
    <div id="answer-buttons" class="flex-column"></div>
    
    <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
      <p style="font-size:0.85rem; color:#8b95a5; margin-bottom: 5px;">Status graczy:</p>
      <div class="players-grid" id="players-status-list"></div>
    </div>
  </div>

  <!-- WIDOK 6: WYNIKI (LEADERBOARD) -->
  <div id="view-leaderboard" class="view-section panel">
    <h2 style="text-align:center; margin-top:0; color:#fbbf24;">Wyniki</h2>
    <div id="leaderboard-list" style="margin: 20px 0;"></div>
    
    <div id="host-next-controls" class="hidden">
      <button class="btn btn-primary" onclick="initiateStart()">Następne pytanie</button>
    </div>
    <div id="host-finish-controls" class="hidden">
      <button class="btn btn-primary" onclick="endGame()">Zakończ Grę</button>
    </div>
  </div>

  <!-- WIDOK 7: FORMULARZ ZGŁASZANIA PYTAŃ -->
  <div id="view-propose" class="view-section panel">
    <h2 style="margin-top:0; color:#f9a8d4;">Zaproponuj Pytanie</h2>
    <div class="input-group"><label>Kategoria</label><input type="text" id="prop-cat" class="input-control"></div>
    <div class="input-group"><label>Treść pytania</label><input type="text" id="prop-q" class="input-control"></div>
    <div style="display:flex; gap:10px; margin-bottom:10px;"><input type="radio" name="prop-correct" value="0" checked><input type="text" id="prop-a0" class="input-control" placeholder="A"></div>
    <div style="display:flex; gap:10px; margin-bottom:10px;"><input type="radio" name="prop-correct" value="1"><input type="text" id="prop-a1" class="input-control" placeholder="B"></div>
    <div style="display:flex; gap:10px; margin-bottom:10px;"><input type="radio" name="prop-correct" value="2"><input type="text" id="prop-a2" class="input-control" placeholder="C"></div>
    <div style="display:flex; gap:10px; margin-bottom:15px;"><input type="radio" name="prop-correct" value="3"><input type="text" id="prop-a3" class="input-control" placeholder="D"></div>
    <div class="flex-row"><button class="btn" onclick="toggleProposeModal()">Anuluj</button><button class="btn" style="color:#f9a8d4; border-color:#f9a8d4;" onclick="submitProposal()">Wyślij do akceptacji</button></div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://wtgibsqcxwkylhsfidgy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Xa3OHOsKSa0_ZTJiHRY45A_fpUfBgpp';
  
  let dbClient = window.parent.dbClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null, currentRoomId = null, isHost = false, roomChannel = null;
  
  let roomSettings = {}, roomState = {}, playersData = [];
  let totalPlayers = 0, currentQuestionIndex = 0;
  
  // Zmienne rundy
  let hasVoted = false, hostVoteTally = {};
  let currentQuestion = null; // Dane pytania
  let shuffledAnswers = [];   // Potasowane odpowiedzi
  let questionStartTime = 0;
  let myScore = 0;

  async function init() {
    const { data: { session } } = await dbClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      document.getElementById('join-nick').value = currentUser.email.split('@')[0];
      document.getElementById('status-text').textContent = 'Gotowy do gry!';
    } else {
      document.getElementById('status-text').textContent = 'Zaloguj się w Hubie!';
      document.getElementById('view-menu').classList.add('hidden');
    }
  }
  init();

  function switchView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
  }

 // --- LOGIKA LOBBY ---
  async function createRoom() {
    const code = Math.random().toString(36).substring(2, 7).toUpperCase();
    roomSettings = {
      q_per_round: parseInt(document.getElementById('set-questions').value),
      vote_time: parseInt(document.getElementById('set-votetime').value),
      ans_time: parseInt(document.getElementById('set-anstime').value)
    };
    
    const { data: room, error: roomError } = await dbClient.from('quiz_rooms')
      .insert([{ room_code: code, host_id: currentUser.id, settings: roomSettings }])
      .select().single();
      
    if (roomError) return alert('Błąd bazy podczas tworzenia pokoju: ' + roomError.message);
    
    isHost = true;
    document.getElementById('host-controls').classList.remove('hidden');
    
    const { error: playerError } = await dbClient.from('quiz_players')
      .insert([{ room_id: room.id, user_id: currentUser.id, nickname: document.getElementById('join-nick').value }]);
      
    if (playerError) return alert('Błąd bazy podczas zapisu hosta: ' + playerError.message);
    
    enterLobby(room.id, code);
  }

  async function joinRoom() {
    const code = document.getElementById('join-code').value.toUpperCase();
    
    const { data: room, error: roomError } = await dbClient.from('quiz_rooms')
      .select('*').eq('room_code', code).single();
      
    if (roomError || !room) return alert('Nie znaleziono pokoju o tym kodzie.');
    if (room.status !== 'lobby') return alert('Gra w tym pokoju już trwa!');
    
    const { error: playerError } = await dbClient.from('quiz_players')
      .insert([{ room_id: room.id, user_id: currentUser.id, nickname: document.getElementById('join-nick').value }]);
      
    if (playerError) return alert('Błąd bazy podczas dołączania gracza: ' + playerError.message);
    
    enterLobby(room.id, code);
  }

  // --- BRAMKA STANU (Realtime) ---
  function syncGameState(roomData) {
    roomSettings = roomData.settings;
    roomState = roomData.state;

    if (roomData.status === 'starting') startCountdownUI();
    if (roomData.status === 'voting') startVotingUI();
    if (roomData.status === 'question') startQuestionUI();
    if (roomData.status === 'leaderboard') showLeaderboardUI();
  }

  // --- ETAP: ODLICZANIE ---
  async function initiateStart() {
    currentQuestionIndex++;
    if (currentQuestionIndex > roomSettings.q_per_round) {
       await dbClient.from('quiz_rooms').update({ status: 'finished' }).eq('id', currentRoomId);
       alert("Koniec Quizu!");
       return;
    }
    
    // Zresetuj flagi gotowości (w bazie)
    await dbClient.from('quiz_players').update({ is_ready: false }).eq('room_id', currentRoomId);

    // Host losuje 3 kategorie z bazy
    const { data } = await dbClient.from('quiz_questions').select('category').eq('is_verified', true);
    const uniqueCats = [...new Set(data.map(q => q.category))];
    const shuffledCats = uniqueCats.sort(() => 0.5 - Math.random()).slice(0, 3);
    
    await dbClient.from('quiz_rooms').update({ status: 'starting', state: { categories: shuffledCats, q_index: currentQuestionIndex } }).eq('id', currentRoomId);
  }

  function startCountdownUI() {
    switchView('view-countdown');
    let count = 5;
    const el = document.getElementById('countdown-text');
    el.textContent = count;
    
    const int = setInterval(() => {
      count--;
      if(count > 0) el.textContent = count;
      else {
        clearInterval(int);
        if(isHost) dbClient.from('quiz_rooms').update({ status: 'voting' }).eq('id', currentRoomId);
      }
    }, 1000);
  }

  // --- ETAP: GŁOSOWANIE ---
  function startVotingUI() {
    switchView('view-voting');
    document.getElementById('q-counter').textContent = roomState.q_index + " / " + roomSettings.q_per_round;
    hasVoted = false; hostVoteTally = {};
    document.getElementById('vote-status').textContent = `Oddane głosy: 0 / ${totalPlayers}`;
    
    const container = document.getElementById('category-buttons');
    container.innerHTML = '';
    
    roomState.categories.forEach(cat => {
       const btn = document.createElement('button');
       btn.className = 'cat-btn'; btn.textContent = cat;
       btn.onclick = () => {
         if(!hasVoted) {
           hasVoted = true;
           document.querySelectorAll('.cat-btn').forEach(b => { b.style.opacity = '0.3'; b.style.pointerEvents = 'none'; });
           btn.style.opacity = '1'; btn.style.borderColor = '#34d399'; btn.style.color = '#34d399';
           roomChannel.send({ type: 'broadcast', event: 'submit_vote', payload: { category: cat } });
         }
       };
       container.appendChild(btn);
    });

    const bar = document.getElementById('vote-progress');
    bar.style.transition = 'none'; bar.style.width = '100%';
    setTimeout(() => { bar.style.transition = `width ${roomSettings.vote_time}s linear`; bar.style.width = '0%'; }, 50);

    if (isHost) setTimeout(() => { finishVoting(); }, roomSettings.vote_time * 1000);
  }

  async function finishVoting() {
    let winner = roomState.categories[0]; let max = -1;
    for (let cat in hostVoteTally) { if (hostVoteTally[cat] > max) { max = hostVoteTally[cat]; winner = cat; } }
    
    // Pobierz 1 losowe pytanie z wygranej kategorii
    const { data } = await dbClient.from('quiz_questions').select('*').eq('category', winner).eq('is_verified', true);
    const randQ = data[Math.floor(Math.random() * data.length)];
    
    await dbClient.from('quiz_rooms').update({ status: 'question', state: { question: randQ } }).eq('id', currentRoomId);
  }

  // --- ETAP: PYTANIE I ODPOWIEDZI ---
  function startQuestionUI() {
    switchView('view-question');
    currentQuestion = roomState.question;
    document.getElementById('q-category-label').textContent = currentQuestion.category;
    document.getElementById('q-text').textContent = currentQuestion.question;
    
    // Renderowanie małych kart graczy na dole
    document.getElementById('players-status-list').innerHTML = playersData.map(p => `<div id="status-${p.user_id}" class="player-card" style="font-size:0.8rem; padding: 6px;">${p.nickname}</div>`).join('');

    // Tasowanie odpowiedzi z zapamiętaniem oryginalnego indeksu
    let mappedAns = currentQuestion.answers.map((text, idx) => ({ text, originalIdx: idx }));
    shuffledAnswers = mappedAns.sort(() => 0.5 - Math.random());
    
    const container = document.getElementById('answer-buttons');
    container.innerHTML = '';
    
    shuffledAnswers.forEach((ansObj, screenIdx) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn'; btn.textContent = ansObj.text;
      btn.id = `ans-btn-${screenIdx}`;
      btn.onclick = () => submitAnswer(screenIdx, ansObj.originalIdx);
      container.appendChild(btn);
    });

    const bar = document.getElementById('ans-progress');
    bar.style.transition = 'none'; bar.style.width = '100%';
    setTimeout(() => { bar.style.transition = `width ${roomSettings.ans_time}s linear`; bar.style.width = '0%'; }, 50);

    questionStartTime = Date.now();

    if (isHost) setTimeout(() => { finalizeQuestion(); }, roomSettings.ans_time * 1000);
  }

  async function submitAnswer(screenIdx, originalIdx) {
    const elapsed = (Date.now() - questionStartTime) / 1000;
    const timeLeft = Math.max(0, roomSettings.ans_time - elapsed);
    
    // Blokada reszty przycisków
    document.querySelectorAll('.ans-btn').forEach(b => { b.disabled = true; });
    const selectedBtn = document.getElementById(`ans-btn-${screenIdx}`);
    selectedBtn.classList.add('ans-selected');

    // Punktacja oparta na refleksie (max 1000 pkt za natychmiastową odp)
    let pointsEarned = 0;
    if (originalIdx === currentQuestion.correct_index) {
        pointsEarned = Math.floor((timeLeft / roomSettings.ans_time) * 1000);
    }
    
    // Zapis do bazy (kumulowanie punktów)
    const { data: myData } = await dbClient.from('quiz_players').select('score').eq('room_id', currentRoomId).eq('user_id', currentUser.id).single();
    await dbClient.from('quiz_players').update({ score: myData.score + pointsEarned, is_ready: true }).eq('room_id', currentRoomId).eq('user_id', currentUser.id);
    
    // Wysyłamy sygnał do reszty, by zazielenili nasz nick na liście (że już odpowiedzieliśmy)
    roomChannel.send({ type: 'broadcast', event: 'player_answered', payload: { user_id: currentUser.id } });
  }

  async function finalizeQuestion() {
    await dbClient.from('quiz_rooms').update({ status: 'leaderboard' }).eq('id', currentRoomId);
  }

  // --- ETAP: TABLICA WYNIKÓW PO RUNDZIE ---
  async function showLeaderboardUI() {
    switchView('view-leaderboard');
    // Pobierz aktualne wyniki
    const { data } = await dbClient.from('quiz_players').select('*').eq('room_id', currentRoomId).order('score', { ascending: false });
    
    let html = '';
    data.forEach((p, idx) => {
      let rankClass = (idx === 0) ? 'rank-1' : '';
      html += `<div class="leaderboard-row ${rankClass}"><span>${idx+1}. ${p.nickname}</span><span>${p.score} pkt</span></div>`;
    });
    document.getElementById('leaderboard-list').innerHTML = html;

    if (isHost) {
      if (roomState.q_index < roomSettings.q_per_round) {
         document.getElementById('host-next-controls').classList.remove('hidden');
      } else {
         document.getElementById('host-finish-controls').classList.remove('hidden');
      }
    }
  }

  function endGame() {
    alert("Koniec Gry! Dziękujemy.");
    switchView('view-menu');
    document.getElementById('host-next-controls').classList.add('hidden');
    document.getElementById('host-finish-controls').classList.add('hidden');
  }

  // --- ZGŁASZANIE PYTAŃ ---
  function toggleProposeModal() {
    const p = document.getElementById('view-propose');
    p.classList.contains('active-view') ? switchView('view-menu') : switchView('view-propose');
  }

  async function submitProposal() {
    const data = {
      category: document.getElementById('prop-cat').value,
      question: document.getElementById('prop-q').value,
      answers: [document.getElementById('prop-a0').value, document.getElementById('prop-a1').value, document.getElementById('prop-a2').value, document.getElementById('prop-a3').value],
      correct_index: parseInt(document.querySelector('input[name="prop-correct"]:checked').value),
      author_id: currentUser.id, author_name: document.getElementById('join-nick').value, is_verified: false
    };
    await dbClient.from('quiz_questions').insert([data]);
    alert('Pytanie wysłane do weryfikacji!'); toggleProposeModal();
  }
</script>

</body>
</html>
