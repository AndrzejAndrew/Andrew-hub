<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Impact - Andrew Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #05060a;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }
    .si-wrapper {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    .si-head h1 {
      margin: 0 0 4px 0;
      font-size: 2rem;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .si-meta {
      color: #8b95a5;
      margin: 0 0 14px 0;
      font-size: 0.9rem;
    }
    .hud-panel {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
      background: rgba(12, 16, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 72px;
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8b95a5;
    }
    .stat-value {
      font-size: 1.35rem;
      font-weight: 700;
      color: #34d399;
      margin-top: 2px;
    }
    .stat-value.cyan { color: #7dd3fc; }
    .stat-value.pink { color: #f472b6; }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.14);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.14);
    }
    .btn-start {
      background: linear-gradient(180deg, rgba(52, 211, 153, 0.24), rgba(52, 211, 153, 0.08));
      border-color: rgba(52, 211, 153, 0.45);
      color: #34d399;
      font-weight: 600;
    }
    .btn-start:hover {
      background: rgba(52, 211, 153, 0.3);
      box-shadow: 0 0 18px rgba(52, 211, 153, 0.25);
    }

    .canvas-frame {
      position: relative;
      display: inline-block;
      padding: 10px;
      background: rgba(12, 16, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    canvas {
      display: block;
      background: #060913;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.22);
      max-width: 100%;
      height: auto;
    }
    .overlay-msg {
      position: absolute;
      inset: 10px;
      border-radius: 10px;
      background: rgba(5, 6, 10, 0.84);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay-msg.hidden {
      display: none;
    }
    .overlay-msg h2 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      color: #fff;
    }
    .overlay-msg p {
      margin: 0 0 16px 0;
      color: #94a3b8;
      font-size: 0.92rem;
    }

    .touch-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .touch-bar .btn {
      min-width: 72px;
      padding: 10px 14px;
      font-size: 1rem;
    }
    .hint {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="si-wrapper">
    <div class="si-head">
      <h1>Space Impact</h1>
      <p class="si-meta" id="player-status">Klasyczny scrollowany kosmos — omijaj przeszkody i niszcz wrogów.</p>
    </div>

    <div class="hud-panel">
      <div class="stat-box">
        <span class="stat-label">Punkty</span>
        <span class="stat-value" id="score-val">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Fala</span>
        <span class="stat-value cyan" id="wave-val">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Życia</span>
        <span class="stat-value pink" id="lives-val">3</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Rekord</span>
        <span class="stat-value cyan" id="best-val">0</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="btn btn-start" id="btn-start" onclick="startGame()">▶ Nowa misja</button>
      <button class="btn" id="btn-pause" onclick="togglePause()">⏸ Pauza</button>
      <button class="btn" id="btn-sound" onclick="toggleSound()">🔊 Dźwięk: ON</button>
    </div>

    <div class="canvas-frame">
      <canvas id="game-canvas" width="560" height="320"></canvas>
      <div class="overlay-msg" id="overlay">
        <h2 id="overlay-title">Gotowy do startu?</h2>
        <p id="overlay-desc">Steruj statkiem (W/S lub Strzałki Góra/Dół) i strzelaj (Spacja).</p>
        <button class="btn btn-start" onclick="startGame()">Rozpocznij misję</button>
      </div>
    </div>

    <div class="touch-bar">
      <button class="btn" id="btn-up">▲ Góra</button>
      <button class="btn" id="btn-down">▼ Dół</button>
      <button class="btn btn-start" id="btn-fire">⚡ Strzał</button>
    </div>

    <div class="hint">Klawiatura: W/S lub Strzałki góra/dół • Spacja: Strzał • P: Pauza</div>
  </div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    let animId = null;
    let running = false;
    let paused = false;
    let soundOn = true;
    let audioCtx = null;

    let score = 0;
    let wave = 1;
    let lives = 3;
    let bestScore = Number(localStorage.getItem('andrew_hub_space_impact_best') || 0);
    let scoreSaved = false;

    let ship = { x: 54, y: H / 2, w: 28, h: 16, speed: 3.4, invuln: 0 };
    let keys = { up: false, down: false, fire: false };
    let fireCooldown = 0;
    let spawnTimer = 0;
    let waveKills = 0;

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    document.getElementById('best-val').textContent = bestScore;

    async function initUserBanner() {
      try {
        const db = window.parent?.dbClient;
        if (!db) return;
        const { data: { session } } = await db.auth.getSession();
        if (session?.user?.email) {
          const nick = session.user.email.split('@')[0];
          document.getElementById('player-status').textContent =
            `Pilot: ${nick.charAt(0).toUpperCase() + nick.slice(1)} — wyniki trafiają do rankingu!`;
        }
      } catch (_) {}
    }
    initUserBanner();

    function initStars() {
      stars = Array.from({ length: 48 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5,
        spd: Math.random() * 1.6 + 0.5
      }));
    }
    initStars();

    function beep(freq = 520, dur = 0.07, type = 'square', vol = 0.04) {
      if (!soundOn) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.01);
      } catch (_) {}
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('btn-sound').textContent = soundOn ? '🔊 Dźwięk: ON' : '🔇 Dźwięk: OFF';
    }

    function updateHud() {
      document.getElementById('score-val').textContent = score;
      document.getElementById('wave-val').textContent = wave;
      document.getElementById('lives-val').textContent = lives;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('andrew_hub_space_impact_best', String(bestScore));
        document.getElementById('best-val').textContent = bestScore;
      }
    }

    function startGame() {
      if (animId) cancelAnimationFrame(animId);
      score = 0;
      wave = 1;
      lives = 3;
      waveKills = 0;
      scoreSaved = false;
      running = true;
      paused = false;
      fireCooldown = 0;
      spawnTimer = 25;

      ship = { x: 54, y: H / 2, w: 28, h: 16, speed: 3.5, invuln: 45 };
      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];

      document.getElementById('btn-pause').textContent = '⏸ Pauza';
      document.getElementById('overlay').classList.add('hidden');
      updateHud();
      loop();
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      document.getElementById('btn-pause').textContent = paused ? '▶ Wznów' : '⏸ Pauza';
      const overlay = document.getElementById('overlay');
      if (paused) {
        document.getElementById('overlay-title').textContent = 'Pauza';
        document.getElementById('overlay-desc').textContent = 'Naciśnij P lub Wznów, aby kontynuować misję.';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        loop();
      }
    }

    function spawnExplosion(x, y, color = '#38bdf8', count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const spd = Math.random() * 2.5 + 0.8;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 18 + Math.floor(Math.random() * 10),
          color
        });
      }
    }

    function spawnEnemy() {
      const hasBoss = enemies.some(e => e.kind === 'boss');
      if (waveKills > 0 && waveKills % 12 === 0 && !hasBoss) {
        enemies.push({
          kind: 'boss',
          x: W - 52,
          y: H / 2,
          w: 44,
          h: 44,
          vx: -0.4,
          vy: 1.3,
          hp: 10 + wave * 3,
          shootTimer: 55,
          pts: 250 * wave
        });
        waveKills++;
        return;
      }

      const roll = Math.random();
      const yPos = 26 + Math.random() * (H - 52);
      if (roll < 0.35) {
        // Asteroit
        enemies.push({
          kind: 'rock',
          x: W + 16,
          y: yPos,
          w: 22,
          h: 22,
          vx: -(1.8 + wave * 0.25 + Math.random() * 0.8),
          vy: (Math.random() - 0.5) * 0.7,
          hp: 2,
          pts: 30
        });
      } else {
        // Statek wroga
        enemies.push({
          kind: 'fighter',
          x: W + 18,
          y: yPos,
          w: 24,
          h: 16,
          vx: -(2.1 + wave * 0.25 + Math.random() * 0.7),
          vy: Math.sin(yPos) * 0.6,
          hp: 2 + Math.floor(wave / 3),
          shootTimer: 55 + Math.floor(Math.random() * 45),
          pts: 60
        });
      }
    }

    function damageShip() {
      if (ship.invuln > 0) return;
      lives--;
      ship.invuln = 75;
      beep(150, 0.22, 'sawtooth', 0.06);
      spawnExplosion(ship.x, ship.y, '#f472b6', 16);
      updateHud();

      if (lives <= 0) {
        finishGame();
      }
    }

    async function finishGame() {
      running = false;
      if (animId) cancelAnimationFrame(animId);
      draw();

      document.getElementById('overlay-title').textContent = `Koniec misji — ${score} pkt`;
      document.getElementById('overlay-desc').textContent = `Dotarłeś do fali ${wave}.`;
      document.getElementById('overlay').classList.remove('hidden');

      if (!scoreSaved && score > 0 && window.parent && typeof window.parent.saveGameScore === 'function') {
        scoreSaved = true;
        const resultLabel = score >= 400 ? 'win' : 'draw';
        await window.parent.saveGameScore('space_impact', 'solo', resultLabel, score, {
          wave,
          best_score: bestScore
        });
      }
    }

    function rectsOverlap(a, b) {
      return (
        Math.abs(a.x - b.x) * 2 < (a.w + b.w) &&
        Math.abs(a.y - b.y) * 2 < (a.h + b.h)
      );
    }

    function update() {
      if (!running || paused) return;

      // Gwiazdy w tle
      stars.forEach(s => {
        s.x -= s.spd * (1 + wave * 0.08);
        if (s.x < 0) {
          s.x = W;
          s.y = Math.random() * H;
        }
      });

      if (ship.invuln > 0) ship.invuln--;
      if (fireCooldown > 0) fireCooldown--;

      if (keys.up) ship.y -= ship.speed;
      if (keys.down) ship.y += ship.speed;
      ship.y = Math.max(18, Math.min(H - 18, ship.y));

      if (keys.fire && fireCooldown <= 0) {
        bullets.push({ x: ship.x + 16, y: ship.y, w: 10, h: 4, vx: 7.5 });
        fireCooldown = 11;
        beep(740, 0.05, 'square', 0.03);
      }

      spawnTimer--;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(24, 62 - wave * 4);
      }

      // Pociski gracza
      bullets.forEach(b => { b.x += b.vx; });
      bullets = bullets.filter(b => b.x < W + 20);

      // Pociski wrogów
      enemyBullets.forEach(eb => {
        eb.x += eb.vx;
        eb.y += eb.vy;
      });
      enemyBullets = enemyBullets.filter(eb => eb.x > -20 && eb.y > -20 && eb.y < H + 20);

      // Przeciwnicy
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;

        if (e.kind === 'boss') {
          if (e.y < 32 || e.y > H - 32) e.vy *= -1;
          if (e.x < W - 120) e.x = W - 120;
        } else {
          if (e.y < 18 || e.y > H - 18) e.vy *= -1;
        }

        if (e.kind === 'fighter' || e.kind === 'boss') {
          e.shootTimer--;
          if (e.shootTimer <= 0) {
            e.shootTimer = e.kind === 'boss' ? 42 : 85;
            const dy = e.kind === 'boss' ? (ship.y - e.y) * 0.015 : 0;
            enemyBullets.push({
              x: e.x - 14,
              y: e.y,
              w: 8,
              h: 4,
              vx: -(3.6 + wave * 0.2),
              vy: dy
            });
          }
        }

        // Kolizja ze statkiem gracza
        if (rectsOverlap(ship, e)) {
          damageShip();
          if (e.kind !== 'boss') {
            spawnExplosion(e.x, e.y, '#f59e0b', 10);
            enemies.splice(i, 1);
            continue;
          }
        }

        // Trafienia pociskami gracza
        let destroyed = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          if (rectsOverlap(bullets[j], e)) {
            bullets.splice(j, 1);
            e.hp--;
            if (e.hp <= 0) {
              score += e.pts;
              waveKills++;
              if (waveKills % 10 === 0) {
                wave++;
              }
              updateHud();
              beep(240, 0.11, 'triangle', 0.05);
              spawnExplosion(e.x, e.y, e.kind === 'boss' ? '#f472b6' : '#34d399', e.kind === 'boss' ? 24 : 12);
              enemies.splice(i, 1);
              destroyed = true;
            }
            break;
          }
        }
        if (destroyed) continue;

        if (e.x < -40) {
          enemies.splice(i, 1);
        }
      }

      // Trafienia pociskami wroga
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        if (rectsOverlap(enemyBullets[i], ship)) {
          enemyBullets.splice(i, 1);
          damageShip();
        }
      }

      // Cząsteczki wybuchów
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, W, H);

      // Gwiazdy
      ctx.fillStyle = 'rgba(226, 232, 240, 0.55)';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Statek gracza
      if (lives > 0 && !(ship.invuln > 0 && Math.floor(ship.invuln / 5) % 2 === 0)) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-13, -9);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-13, 9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Pociski gracza
      ctx.fillStyle = '#7dd3fc';
      bullets.forEach(b => {
        ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      });

      // Pociski wrogów
      ctx.fillStyle = '#f472b6';
      enemyBullets.forEach(eb => {
        ctx.fillRect(eb.x - eb.w / 2, eb.y - eb.h / 2, eb.w, eb.h);
      });

      // Przeciwnicy
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.kind === 'rock') {
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(0, 0, e.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.kind === 'boss') {
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-10, -8, 12, 16);
        } else {
          ctx.fillStyle = '#a78bfa';
          ctx.beginPath();
          ctx.moveTo(-12, 0);
          ctx.lineTo(11, -8);
          ctx.lineTo(7, 0);
          ctx.lineTo(11, 8);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      });

      // Cząsteczki
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      });
    }

    function loop() {
      if (!running || paused) return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
      if (k === 'arrowup' || k === 'w') keys.up = true;
      if (k === 'arrowdown' || k === 's') keys.down = true;
      if (k === ' ') keys.fire = true;
      if (k === 'p') togglePause();
      if (k === 'enter' && !running) startGame();
    });

    document.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') keys.up = false;
      if (k === 'arrowdown' || k === 's') keys.down = false;
      if (k === ' ') keys.fire = false;
    });

    function bindHold(btnId, prop) {
      const el = document.getElementById(btnId);
      if (!el) return;
      el.addEventListener('pointerdown', () => { keys[prop] = true; });
      el.addEventListener('pointerup', () => { keys[prop] = false; });
      el.addEventListener('pointerleave', () => { keys[prop] = false; });
    }
    bindHold('btn-up', 'up');
    bindHold('btn-down', 'down');
    bindHold('btn-fire', 'fire');

    draw();
  </script>
</body>
</html>
