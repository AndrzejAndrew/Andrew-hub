<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kółko i Krzyżyk - Nexus Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* STYLIZACJA ZGODNA Z NEXUS HUB (Luminous Bento) */
    body {
      background-color: #05060a; color: #f8fafc; font-family: 'Inter', sans-serif;
      margin: 0; padding: 30px 20px; display: flex; justify-content: center;
    }
    .ttt-wrapper { max-width: 600px; width: 100%; text-align: center; }
    
    .ttt-head h1 { margin-bottom: 4px; color: #fff; font-size: 2.2rem; letter-spacing: -0.5px;}
    .ttt-meta { color: #8b95a5; margin-bottom: 24px; font-size: 0.9rem;}
    
    .menu-section, .game-section { display: none; }
    .active-section { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px 24px;
      border-radius: 12px; cursor: pointer; font-size: 1rem; margin: 8px; font-weight: 500;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1); transition: all 0.25s ease;
    }
    .btn:hover { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.4); box-shadow: 0 0 15px rgba(56,189,248,0.2); transform: translateY(-1px); }
    .btn-action { background: linear-gradient(180deg, rgba(52,211,153,0.2), rgba(52,211,153,0.05)); border-color: rgba(52,211,153,0.4); color: #34d399;}
    .btn-action:hover { box-shadow: 0 0 20px rgba(52,211,153,0.3); background: rgba(52,211,153,0.25); }

    .input-code {
      padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);
      color: #7dd3fc; font-size: 1.1rem; width: 140px; text-align: center; letter-spacing: 2px; font-weight: bold; outline: none;
    }
    .input-code:focus { border-color: #7dd3fc; }

    /* PLANSZA GRY */
    .ttt-board-container { margin-top: 25px; display: inline-block;}
    .ttt-board {
      display: grid; grid-template-columns: repeat(3, 100px); grid-auto-rows: 100px; gap: 8px;
    }
    .ttt-cell {
      display: flex; align-items: center; justify-content: center; font-size: 60px;
      background: linear-gradient(180deg, rgba(18,22,34,0.8), rgba(10,12,18,0.95)); 
      border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; cursor: pointer; user-select: none; 
      transition: all 0.2s; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .ttt-cell:hover:not(.disabled) { background: rgba(255,255,255,0.08); border-color: rgba(56,189,248,0.4); transform: scale(1.02);}
    .ttt-cell.disabled { cursor: not-allowed; opacity: 0.6; }
    
    /* Zwycięskie komórki */
    .ttt-cell-win { 
      background: rgba(52,211,153,0.15) !important; border-color: #34d399 !important; 
      color: #34d399; box-shadow: 0 0 20px rgba(52,211,153,0.2);
    }
    
    /* PANELE STATUSU I WYNIKÓW */
    .status-panel { 
      margin-top: 15px; padding: 20px; background: rgba(10,12,18,0.8); backdrop-filter: blur(10px);
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .code-display { font-size: 1.2rem; font-weight: bold; color: #7dd3fc; letter-spacing: 2px; padding: 4px 10px; background: rgba(125,211,252,0.1); border-radius: 6px;}
    
    .score-board {
      display: flex; justify-content: center; gap: 40px; margin-top: 15px; font-size: 1.1rem;
    }
    .score-box { display: flex; flex-direction: column; align-items: center; }
    .score-label { font-size: 0.8rem; color: #8b95a5; text-transform: uppercase; letter-spacing: 1px;}
    .score-value { font-size: 1.8rem; font-weight: bold; color: #fff; margin-top: 4px;}
    .score-you { color: #34d399; } /* Wyróżnienie wyniku własnego */

    #restart-btn-container { margin-top: 20px; display: none; height: 50px;}
  </style>
</head>
<body>

<div class="ttt-wrapper">
  <div class="ttt-head">
    <h1>Kółko i Krzyżyk</h1>
    <p class="ttt-meta" id="player-greeting">Łączenie z bazą bazy danych...</p>
  </div>

  <!-- MENU GŁÓWNE -->
  <div id="menu-section" class="menu-section active-section">
    <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin-bottom: 20px;">
      <h2 style="margin-top:0; font-size: 1.3rem;">Nowa gra</h2>
      <button class="btn" onclick="startHotSeat()">👥 Tryb Hot-Seat (Lokalnie)</button>
      <button class="btn btn-action" onclick="createOnlineRoom()">🌍 Utwórz pokój online</button>
    </div>
    
    <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 16px;">
      <h2 style="margin-top:0; font-size: 1.3rem;">Dołącz do istniejącej gry</h2>
      <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
        <input type="text" id="join-code" class="input-code" maxlength="5" placeholder="KOD">
        <button class="btn" onclick="joinOnlineRoom()" style="margin:0;">Dołącz</button>
      </div>
    </div>
  </div>

  <!-- SEKCJA GRY -->
  <div id="game-section" class="game-section">
    <div id="online-info" style="display:none; margin-bottom: 10px; color: #8b95a5;">
      Zaproś gracza podając kod: <span id="room-code-display" class="code-display"></span>
    </div>
    
    <div class="status-panel">
      <h3 id="game-status" style="margin:0 0 10px 0; font-size: 1.4rem;">Oczekiwanie na gracza...</h3>
      
      <!-- TABLICA WYNIKÓW -->
      <div class="score-board">
        <div class="score-box">
          <span class="score-label" id="label-player1">Gracz 1 (X)</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score-box" style="justify-content: center; color: #475569; font-weight: bold;">:</div>
        <div class="score-box">
          <span class="score-label" id="label-player2">Gracz 2 (O)</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </div>
    </div>

    <div class="ttt-board-container">
      <div id="board" class="ttt-board"></div>
    </div>

    <div id="restart-btn-container">
      <button class="btn btn-action" onclick="restartGame()">🔄 Zagraj ponownie</button>
    </div>

    <div style="margin-top: 30px;">
      <button class="btn" onclick="returnToMenu()" style="font-size: 0.85rem; padding: 8px 16px; background: transparent; border-color: rgba(255,255,255,0.1);">Wróć do menu</button>
    </div>
  </div>
</div>

<script>
  // INICJALIZACJA BAZY
  const SUPABASE_URL = 'https://wtgibsqcxwkylhsfidgy.supabase.co';
  const SUPABASE_KEY = 'WSTAW_TUTAJ_SWÓJ_SKOPIOWANY_KLUCZ_PUBLICZNY'; // KLUCZ ANON PUBLIC
  
  let dbClient;
  if (window.parent.dbClient) {
      dbClient = window.parent.dbClient; 
  } else {
      dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  let currentUser = null;
  let currentRoomId = null;
  let gameMode = null; 
  let mySymbol = null; 
  let subscription = null;
  
  let localBoard = '_________';
  let localTurn = 'X';
  let localStatus = 'playing'; 
  let scoreX = 0;
  let scoreO = 0;

  async function checkAuth() {
    const { data: { session } } = await dbClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      document.getElementById('player-greeting').textContent = 'Zalogowano jako: ' + currentUser.email.split('@')[0];
    } else {
      document.getElementById('player-greeting').textContent = 'Tryb gościa. Zaloguj się w Hubie, aby grać online.';
    }
  }
  checkAuth();

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('game-status');
  const menuSection = document.getElementById('menu-section');
  const gameSection = document.getElementById('game-section');
  const restartContainer = document.getElementById('restart-btn-container');

  // TRYB HOT-SEAT
  function startHotSeat() {
    gameMode = 'hotseat';
    localBoard = '_________';
    localTurn = 'X';
    localStatus = 'playing';
    scoreX = 0; scoreO = 0;
    
    document.getElementById('online-info').style.display = 'none';
    document.getElementById('label-player1').textContent = 'Gracz 1 (X)';
    document.getElementById('label-player2').textContent = 'Gracz 2 (O)';
    
    menuSection.classList.remove('active-section');
    gameSection.classList.add('active-section');
    renderBoard();
  }

  // TWORZENIE GRY ONLINE
  async function createOnlineRoom() {
    if (!currentUser) return alert('Musisz być zalogowany, aby stworzyć pokój online!');
    const code = Math.random().toString(36).substring(2, 7).toUpperCase();
    
    const { data, error } = await dbClient
      .from('tic_tac_toe')
      .insert([{ room_code: code, player_x: currentUser.id, score_x: 0, score_o: 0 }])
      .select().single();

    if (error) return alert('Błąd tworzenia pokoju: ' + error.message);
    setupOnlineGame(data.id, code, 'X');
  }

  // DOŁĄCZANIE DO GRY ONLINE
  async function joinOnlineRoom() {
    if (!currentUser) return alert('Musisz być zalogowany!');
    const code = document.getElementById('join-code').value.toUpperCase();
    if (!code) return;

    const { data: room, error } = await dbClient.from('tic_tac_toe').select('*').eq('room_code', code).single();

    if (error || !room) return alert('Nie znaleziono takiego pokoju.');
    
    let symbol = 'O';
    if (room.player_x === currentUser.id) {
        symbol = 'X';
    } else if (!room.player_o) {
      await dbClient.from('tic_tac_toe').update({ player_o: currentUser.id, status: 'playing' }).eq('id', room.id);
    } else if (room.player_o === currentUser.id) {
        symbol = 'O'; 
    } else if (room.status !== 'waiting') {
        return alert('Gra w tym pokoju jest już pełna!');
    }

    setupOnlineGame(room.id, code, symbol);
  }

  function setupOnlineGame(roomId, code, symbol) {
    gameMode = 'online';
    currentRoomId = roomId;
    mySymbol = symbol;
    
    document.getElementById('online-info').style.display = 'block';
    document.getElementById('room-code-display').textContent = code;
    
    // Dynamiczne etykiety wyników z perspektywy gracza
    if(symbol === 'X') {
      document.getElementById('label-player1').innerHTML = 'Ty (X) <span style="color:#34d399;">●</span>';
      document.getElementById('label-player2').textContent = 'Przeciwnik (O)';
    } else {
      document.getElementById('label-player1').textContent = 'Przeciwnik (X)';
      document.getElementById('label-player2').innerHTML = 'Ty (O) <span style="color:#34d399;">●</span>';
    }
    
    menuSection.classList.remove('active-section');
    gameSection.classList.add('active-section');
    subscribeToGame();
  }

  function subscribeToGame() {
    if (subscription) dbClient.removeChannel(subscription);
    subscription = dbClient.channel('game-updates')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'tic_tac_toe', filter: `id=eq.${currentRoomId}` }, 
        payload => { updateOnlineState(payload.new); }
      ).subscribe();

    dbClient.from('tic_tac_toe').select('*').eq('id', currentRoomId).single().then(({data}) => updateOnlineState(data));
  }

  function updateOnlineState(dbState) {
    localBoard = dbState.board;
    localTurn = dbState.turn;
    localStatus = dbState.status;
    scoreX = dbState.score_x || 0;
    scoreO = dbState.score_o || 0;
    renderBoard();
  }

  // RYSOWANIE PLANSZY I RUCHY
  function renderBoard() {
    boardEl.innerHTML = '';
    const brd = localBoard.split('');
    const winCells = checkWin(localBoard);

    document.getElementById('score-x').textContent = scoreX;
    document.getElementById('score-o').textContent = scoreO;
    restartContainer.style.display = (localStatus === 'finished') ? 'block' : 'none';

    if (localStatus === 'finished') {
      let winMsg = 'Koniec gry! Remis.';
      if (winCells) {
         let winnerSymbol = localTurn === 'X' ? 'O' : 'X';
         if (gameMode === 'online') {
            winMsg = (winnerSymbol === mySymbol) ? 'Gratulacje! Wygrałeś!' : 'Przegrałeś!';
         } else {
            winMsg = `Koniec gry! Wygrywa: ${winnerSymbol}`;
         }
      }
      statusEl.textContent = winMsg;
      statusEl.style.color = (winMsg.includes('Wygra') || winMsg.includes('X') || winMsg.includes('O')) ? '#34d399' : '#9ca3af';
    } else if (gameMode === 'online' && localStatus === 'waiting') {
      statusEl.textContent = 'Oczekiwanie na drugiego gracza...';
      statusEl.style.color = '#7dd3fc';
    } else {
      if(gameMode === 'online') {
        statusEl.textContent = (localTurn === mySymbol) ? 'Twój ruch!' : 'Ruch przeciwnika...';
        statusEl.style.color = (localTurn === mySymbol) ? '#fff' : '#8b95a5';
      } else {
        statusEl.textContent = `Tura gracza: ${localTurn}`;
        statusEl.style.color = '#fff';
      }
    }

    brd.forEach((val, idx) => {
      const cell = document.createElement('div');
      cell.className = 'ttt-cell';
      cell.textContent = val === '_' ? '' : val;

      let canClick = false;
      if (val === '_' && localStatus === 'playing') {
        if (gameMode === 'hotseat') canClick = true;
        if (gameMode === 'online' && mySymbol === localTurn) canClick = true;
      }

      if (!canClick) cell.classList.add('disabled');
      if (winCells && winCells.includes(idx)) cell.classList.add('ttt-cell-win');

      cell.addEventListener('click', () => { if(canClick) makeMove(idx); });
      boardEl.appendChild(cell);
    });
  }

  async function makeMove(idx) {
    const brdArr = localBoard.split('');
    brdArr[idx] = localTurn;
    const newBoard = brdArr.join('');
    const winCells = checkWin(newBoard);
    
    let newStatus = 'playing';
    let newTurn = localTurn === 'X' ? 'O' : 'X';
    let winner = null;
    let sX = scoreX, sO = scoreO;

    if (winCells) {
      newStatus = 'finished';
      winner = localTurn;
      if(winner === 'X') sX++; else sO++;
    } else if (!newBoard.includes('_')) {
      newStatus = 'finished';
      winner = 'draw';
    }

    if (gameMode === 'hotseat') {
      localBoard = newBoard; localTurn = newTurn; localStatus = newStatus; scoreX = sX; scoreO = sO;
      renderBoard();
    } else if (gameMode === 'online') {
      localTurn = newTurn; renderBoard();
      await dbClient.from('tic_tac_toe').update({ board: newBoard, turn: newTurn, status: newStatus, winner: winner, score_x: sX, score_o: sO }).eq('id', currentRoomId);
    }
  }

  // RESTART GRY (BEZ WYCHODZENIA Z POKOJU)
  async function restartGame() {
    const newBoard = '_________';
    // Przegrany (lub 'X' przy remisie) zaczyna nową rundę
    const newTurn = (localStatus === 'finished' && !checkWin(localBoard)) ? 'X' : localTurn; 
    
    if (gameMode === 'hotseat') {
      localBoard = newBoard; localTurn = newTurn; localStatus = 'playing'; renderBoard();
    } else if (gameMode === 'online') {
      await dbClient.from('tic_tac_toe').update({ board: newBoard, turn: newTurn, status: 'playing', winner: null }).eq('id', currentRoomId);
    }
  }

  function checkWin(boardStr) {
    const p = [ [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6] ];
    for (let c of p) {
      if (boardStr[c[0]] !== '_' && boardStr[c[0]] === boardStr[c[1]] && boardStr[c[1]] === boardStr[c[2]]) return c;
    }
    return null;
  }

  function returnToMenu() {
    if(subscription) dbClient.removeChannel(subscription);
    gameSection.classList.remove('active-section');
    menuSection.classList.add('active-section');
  }
</script>

</body>
</html>
